{% extends 'base.html' %}
{% block title %}Page Not Found{% endblock %}
{% block page_title %}404{% endblock %}

{% block content %}
<div class="text-center py-5">
  <i class="bi bi-file-earmark-x display-1 text-muted opacity-50"></i>
  <h2 class="mt-3">Page Not Found</h2>
  <p class="text-muted mb-4">The page you're looking for doesn't exist.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">
    <i class="bi bi-house me-1"></i>Go Home
  </a>
</div>
{% endblock %}

{% block unauth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
  <div class="text-center">
    <i class="bi bi-file-earmark-x display-1 text-muted"></i>
    <h2 class="mt-3">404 — Page Not Found</h2>
    <a href="{{ url_for('login') }}" class="btn btn-primary mt-3">Back to Sign In</a>
  </div>
</div>
{% endblock %}
